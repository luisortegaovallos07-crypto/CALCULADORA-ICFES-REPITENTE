<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Puntaje ICFES</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

    :root {
      --page: #f0f4f8;
      --card: #ffffff;
      --paper: #f7fafc;
      --ink: #0f172a;
      --pencil: #64748b;
      --border: #cbd5e1;
      --amber: #f59e0b;
      --amber-bg: rgba(245, 158, 11, 0.1);
      --red: #ef4444;
      --red-bg: rgba(239, 68, 68, 0.1);
      --green: #10b981;
      --green-bg: rgba(16, 185, 129, 0.1);
      --glow-amber: rgba(245, 158, 11, 0.4);
      --glow-green: rgba(16, 185, 129, 0.4);
      --glow-red: rgba(239, 68, 68, 0.4);
      --key-lip: #94a3b8;
      --shadow: 0 10px 30px -10px rgba(15, 23, 42, 0.15), 0 1px 3px rgba(15, 23, 42, 0.05);
      --card-shadow-hover: 0 20px 40px -15px rgba(15, 23, 42, 0.25);
      --radius: 16px;
      --3d-perspective: 1200px;
    }

    [data-theme="dark"] {
      --page: #080c14;
      --card: #111827;
      --paper: #1f2937;
      --ink: #f3f4f6;
      --pencil: #9ca3af;
      --border: #374151;
      --amber: #fbbf24;
      --amber-bg: rgba(251, 191, 36, 0.12);
      --red: #f87171;
      --red-bg: rgba(248, 113, 113, 0.12);
      --green: #34d399;
      --green-bg: rgba(52, 211, 153, 0.12);
      --glow-amber: rgba(251, 191, 36, 0.5);
      --glow-green: rgba(52, 211, 153, 0.5);
      --glow-red: rgba(248, 113, 113, 0.5);
      --key-lip: #030712;
      --shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      --card-shadow-hover: 0 25px 50px -10px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: 'IBM Plex Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background .4s cubic-bezier(0.4, 0, 0.2, 1), color .4s cubic-bezier(0.4, 0, 0.2, 1);
      min-height: 100vh;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    /* HEADER */
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
      margin-bottom: 40px;
    }

    .eyebrow {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .16em;
      color: var(--green);
      text-shadow: 0 0 8px var(--glow-green);
      text-transform: uppercase;
      margin: 0 0 10px;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: clamp(28px, 5vw, 42px);
      margin: 0;
      letter-spacing: -.02em;
      line-height: 1.1;
      background: linear-gradient(135deg, var(--ink) 30%, var(--pencil));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .sub {
      color: var(--pencil);
      font-size: 15px;
      line-height: 1.5;
      margin: 12px 0 0;
      max-width: 600px;
    }

    .theme-toggle {
      flex: 0 0 auto;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      border: 1px solid var(--border);
      border-bottom: 4px solid var(--key-lip);
      background: var(--card);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform .12s cubic-bezier(0.175, 0.885, 0.32, 1.275), background .3s ease, border-color .3s ease, box-shadow .12s ease;
      transform: translateY(-2px);
    }

    .theme-toggle:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 0 var(--key-lip), 0 10px 20px rgba(0, 0, 0, 0.15);
    }

    .theme-toggle:active {
      transform: translateY(2px);
      box-shadow: 0 0px 0 var(--key-lip), 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .theme-toggle svg {
      width: 22px;
      height: 22px;
      stroke: var(--ink);
      fill: none;
      transition: transform .3s ease;
    }

    .theme-toggle:hover svg {
      transform: rotate(20deg);
    }

    .theme-toggle .moon {
      display: none;
    }

    [data-theme="dark"] .theme-toggle .sun {
      display: none;
    }

    [data-theme="dark"] .theme-toggle .moon {
      display: block;
    }

    /* CARDS GRID */
    .cards {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 20px;
      margin-bottom: 40px;
    }

    @media (max-width: 1024px) {
      .cards {
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
    }

    @media (max-width: 768px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
      }
    }

    @media (max-width: 480px) {
      .cards {
        grid-template-columns: 1fr;
        gap: 16px;
      }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 20px 24px;
      box-shadow: var(--shadow);
      transition: box-shadow .3s ease, border-color .3s ease, background .3s ease;
      position: relative;
    }

    .card:hover {
      box-shadow: var(--card-shadow-hover);
    }

    .card.invalid {
      border-color: var(--red);
      box-shadow: 0 0 15px var(--glow-red);
    }

    .card-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .badge {
      flex: 0 0 auto;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--ink);
      color: var(--card);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: .02em;
      border: 2px solid var(--amber);
      box-shadow: 0 0 10px var(--glow-amber);
      transition: border-color .2s ease, box-shadow .2s ease;
    }

    .card.invalid .badge {
      border-color: var(--red);
      box-shadow: 0 0 10px var(--glow-red);
    }

    .card-head h3 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      line-height: 1.2;
      font-weight: 700;
      margin: 0;
    }

    .card-head p {
      margin: 3px 0 0;
      font-size: 12px;
      color: var(--pencil);
      font-family: 'IBM Plex Mono', monospace;
    }

    /* GLOWING LED BUBBLES */
    .bubbles {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
      justify-content: space-between;
    }

    .bubble {
      width: 100%;
      height: 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--paper);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.15), 0 1px 0 rgba(255, 255, 255, 0.05);
      transition: background .3s cubic-bezier(0.4, 0, 0.2, 1), border-color .3s ease, box-shadow .3s ease;
    }

    .bubble.filled {
      background: radial-gradient(circle at 4px 4px, #ffd880, var(--amber));
      border-color: var(--amber);
      box-shadow: 0 0 12px var(--amber), inset 0 1px 1px rgba(255, 255, 255, 0.4);
    }

    .field {
      display: block;
      margin-bottom: 16px;
    }

    .field>span {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--pencil);
      margin-bottom: 8px;
    }

    /* MECHANICAL KEYCAP STEPPER */
    .stepper {
      display: flex;
      align-items: stretch;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: visible;
      background: var(--paper);
      padding: 4px;
      gap: 4px;
    }

    .step-btn {
      flex: 0 0 40px;
      height: 40px;
      border: 1px solid var(--border);
      border-bottom: 4px solid var(--key-lip);
      border-radius: 8px;
      background: var(--card);
      color: var(--ink);
      font-size: 18px;
      font-weight: 600;
      font-family: 'IBM Plex Mono', monospace;
      cursor: pointer;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.05);
      transition: transform .1s ease, box-shadow .1s ease, background .2s ease;
      transform: translateY(-2px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .step-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 4px 0 var(--key-lip), 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .step-btn:active {
      transform: translateY(1px);
      box-shadow: 0 0px 0 var(--key-lip), 0 1px 2px rgba(0, 0, 0, 0.15);
    }

    input[type=number] {
      flex: 1 1 auto;
      width: 100%;
      min-width: 0;
      border: none;
      background: transparent;
      text-align: center;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 18px;
      font-weight: 600;
      color: var(--ink);
      padding: 0;
      -moz-appearance: textfield;
    }

    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type=number]:focus {
      outline: none;
    }

    .stepper:focus-within {
      border-color: var(--amber);
      box-shadow: 0 0 0 3px var(--amber-bg);
    }

    .card.invalid .stepper {
      border-color: var(--red);
    }

    .card.invalid .stepper:focus-within {
      box-shadow: 0 0 0 3px var(--red-bg);
    }

    .error-msg {
      font-size: 12px;
      color: var(--red);
      margin: 8px 2px 0;
      min-height: 16px;
      font-family: 'IBM Plex Mono', monospace;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      margin: 16px 0 12px;
    }

    .stat-label {
      display: block;
      font-size: 11px;
      color: var(--pencil);
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 600;
    }

    .stat-value {
      display: block;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 22px;
      font-weight: 600;
      margin-top: 4px;
    }

    .stat-value.correct {
      color: var(--green);
      text-shadow: 0 0 10px var(--glow-green);
    }

    .stat-value.score {
      color: var(--amber);
      text-shadow: 0 0 10px var(--glow-amber);
    }

    .bar-track {
      height: 8px;
      border-radius: 4px;
      background: var(--paper);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--amber), #f59e0b);
      border-radius: 4px;
      width: 100%;
      transition: width .6s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* GLOBAL SCORE BANNER */
    .score-banner {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 32px;
      box-shadow: var(--shadow);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 10px;
      margin-bottom: 32px;
      transition: background .3s ease, border-color .3s ease;
    }

    .score-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .score-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--pencil);
      text-transform: uppercase;
      letter-spacing: .08em;
      font-family: 'IBM Plex Mono', monospace;
    }

    .score-number-wrap {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .score-number {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 54px;
      font-weight: 700;
      color: var(--amber);
      line-height: 1;
      text-shadow: 0 0 15px var(--glow-amber);
    }

    .score-max {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 20px;
      color: var(--pencil);
      font-weight: 500;
    }

    .score-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ticket-warning {
      font-size: 14px;
      color: var(--red);
      background: var(--red-bg);
      border: 1px solid var(--red);
      border-radius: 10px;
      padding: 12px 16px;
      font-family: 'IBM Plex Mono', monospace;
      box-shadow: 0 0 10px var(--glow-red);
      margin: 0;
      width: 100%;
    }

    .btn {
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform .1s ease, background .2s ease, box-shadow .1s ease, opacity .2s ease;
      border: 1px solid var(--border);
      border-bottom: 4px solid var(--key-lip);
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(2px);
      border-bottom-width: 1px;
    }

    .btn.ghost {
      background: var(--paper);
      color: var(--ink);
    }

    .btn.ghost:hover {
      background: var(--border);
      transform: translateY(-3px);
    }

    .btn.solid {
      background: var(--ink);
      color: var(--card);
      border-color: var(--ink);
      border-bottom-color: var(--key-lip);
    }

    .btn.solid:hover {
      opacity: .95;
      transform: translateY(-3px);
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .toast {
      font-size: 13px;
      color: var(--green);
      font-family: 'IBM Plex Mono', monospace;
      opacity: 0;
      font-weight: 600;
      transition: opacity .25s ease;
      text-shadow: 0 0 8px var(--glow-green);
      margin-left: 8px;
    }

    .toast.show {
      opacity: 1;
    }



    footer {
      text-align: center;
      color: var(--pencil);
      font-size: 13px;
      margin-top: 32px;
      font-family: 'IBM Plex Mono', monospace;
    }

    @media (max-width: 600px) {
      .score-banner {
        flex-direction: column;
        align-items: stretch;
        padding: 20px;
      }

      .score-actions {
        justify-content: space-between;
      }

      .score-number {
        font-size: 44px;
      }

      header {
        flex-direction: column;
        align-items: stretch;
      }

      .theme-toggle {
        align-self: flex-end;
      }

      .wrap {
        padding: 24px 16px 48px;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">

    <header>
      <div>
        <p class="eyebrow">Saber 11 · tablas de equivalencia</p>
        <h1>Calculadora de puntaje ICFES</h1>
      </div>
      <button class="theme-toggle" id="theme-toggle" aria-label="Cambiar tema">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
      </button>
    </header>

    <div class="score-banner" id="global-score-container">
      <div class="score-info">
        <span class="score-title">Puntaje Global</span>
        <div class="score-number-wrap">
          <span id="global-score" class="score-number">500</span><span class="score-max">/ 500</span>
        </div>
      </div>
      <div class="score-actions">
        <button class="btn ghost" id="btn-reset">Reiniciar</button>
        <button class="btn solid" id="btn-copy">Copiar resultado</button>
        <span class="toast" id="toast">Copiado ✓</span>
      </div>
      <p class="ticket-warning" id="ticket-warning" hidden>Corrige los campos marcados en rojo para ver tu puntaje
        global.</p>
    </div>

    <div class="cards" id="cards"></div>

    <footer>
  
      <div style="margin-top: 16px; font-weight: 600; letter-spacing: 0.05em; color: var(--green);">CREADO POR EL ING
        DANIEL ORTEGA</div>
    </footer>
  </div>

  <script>

       Llave = preguntas incorrectas · Valor = puntaje (0-100)
       Para actualizar el examen en el futuro, solo se edita este objeto.

        30: 48, 31: 47, 32: 46, 33: 46, 34: 45, 35: 44, 36: 44, 37: 43, 38: 42, 39: 41,
        40: 41, 41: 40, 42: 39, 43: 39, 44: 38, 45: 37, 46: 37, 47: 36, 48: 35, 49: 35,
        50: 34, 51: 33, 52: 32, 53: 32, 54: 31, 55: 30
      }
    };

    /* Configuración de materias (fácil de extender/editar) */
    const materias = [
      {
        key: 'matematicas',
        nombre: 'Matemáticas',
        codigo: 'MAT',
        total: 50,
        logo: `<svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7v10a2 2 0 0 1-2 2M15 7v12"/></svg>`

      {

      {

      },
      {
        key: 'naturales',
        nombre: 'Ciencias Naturales',
        codigo: 'CN',
        total: 58,
        logo: `<svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="12" rx="3" ry="9" transform="rotate(45 12 12)"/><ellipse cx="12" cy="12" rx="3" ry="9" transform="rotate(-45 12 12)"/><circle cx="12" cy="12" r="1.5"/></svg>`
      },
      {
        key: 'ingles',
        nombre: 'Inglés',
        codigo: 'ING',
        total: 55,
        logo: `<svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><text x="12" y="13" font-size="8" font-family="'IBM Plex Mono', monospace" font-weight="900" fill="currentColor" stroke="none" text-anchor="middle">EN</text></svg>`
      },
    ];

    const state = {};
    materias.forEach(m => { state[m.key] = { incorrectas: 0, valid: true }; });

    /* Consola de logs desactivada */
    function logConsole(message, type = 'INFO') {
      // Desactivado
    }



    /* Consulta directa en la tabla, sin cálculo aritmético del puntaje */
    function consultarPuntaje(materiaKey, incorrectas) {
      const tabla = equivalencias[materiaKey];
      return Object.prototype.hasOwnProperty.call(tabla, incorrectas) ? tabla[incorrectas] : null;
    }

    function validar(rawValue, total) {
      if (rawValue === '') return { valid: true, value: 0 };
      const n = Number(rawValue);
      if (!Number.isInteger(n)) return { valid: false, message: 'Debe ser un número entero' };
      if (n < 0) return { valid: false, message: 'No puede ser negativo' };
      if (n > total) return { valid: false, message: `Máximo ${total} preguntas` };
      return { valid: true, value: n };
    }

    const cardsEl = document.getElementById('cards');

    materias.forEach(m => {
      const card = document.createElement('article');
      card.className = 'card';
      card.dataset.materia = m.key;
      card.innerHTML = `
    <div class="card-head">
      <div class="badge">${m.logo}</div>
      <div>
        <h3>${m.nombre}</h3>
        <p>${m.codigo} · ${m.total} preguntas</p>
      </div>
    </div>
    <div class="bubbles" id="bubbles-${m.key}"></div>
    <label class="field">
      <span>Preguntas incorrectas</span>
      <div class="stepper">
        <button type="button" class="step-btn" data-action="dec" aria-label="Restar">–</button>
        <input type="number" inputmode="numeric" min="0" max="${m.total}" value="0" id="input-${m.key}">
        <button type="button" class="step-btn" data-action="inc" aria-label="Sumar">+</button>
      </div>
      <p class="error-msg" id="error-${m.key}"></p>
    </label>
    <div class="stats">
      <div>
        <span class="stat-label">Correctas</span>
        <span class="stat-value correct" id="correct-${m.key}">${m.total}</span>
      </div>
      <div>
        <span class="stat-label">Puntaje</span>
        <span class="stat-value score" id="score-${m.key}">100</span>
      </div>
    </div>
    <div class="bar-track"><div class="bar-fill" id="bar-${m.key}"></div></div>
  `;
      cardsEl.appendChild(card);

      // 10 burbujas tipo hoja de respuestas
      const bubblesWrap = card.querySelector(`#bubbles-${m.key}`);
      for (let i = 0; i < 10; i++) {
        const b = document.createElement('div');
        b.className = 'bubble filled';
        bubblesWrap.appendChild(b);
      }
    });





    function animarNumero(el, nuevoValor) {
      const anterior = Number(el.dataset.val || el.textContent) || 0;
      const destino = Number(nuevoValor);
      if (anterior === destino) { el.textContent = destino; el.dataset.val = destino; return; }
      const dur = 350;
      const t0 = performance.now();
      function frame(t) {
        const p = Math.min(1, (t - t0) / dur);
        const eased = 1 - Math.pow(1 - p, 3);
        const val = Math.round(anterior + (destino - anterior) * eased);
        el.textContent = val;
        if (p < 1) requestAnimationFrame(frame);
        else el.dataset.val = destino;
      }
      requestAnimationFrame(frame);
    }

    // Controlar animación del ticket de resultados al actualizarse
    function animarTicket() {
      // Sin movimiento
    }

    function actualizarMateria(key) {
      const m = materias.find(x => x.key === key);
      const input = document.getElementById(`input-${key}`);
      const card = input.closest('.card');
      const errorEl = document.getElementById(`error-${key}`);
      const correctEl = document.getElementById(`correct-${key}`);
      const scoreEl = document.getElementById(`score-${key}`);
      const barEl = document.getElementById(`bar-${key}`);
      const bubbles = document.querySelectorAll(`#bubbles-${key} .bubble`);

      const res = validar(input.value, m.total);

      if (!res.valid) {
        state[key].valid = false;
        card.classList.add('invalid');
        errorEl.textContent = res.message;
        correctEl.textContent = '—';
        scoreEl.textContent = '—';
        barEl.style.width = '0%';
        bubbles.forEach(b => b.classList.remove('filled'));
        logConsole(`Error en ${m.nombre.toUpperCase()}: ${res.message}`, 'ERROR');
      } else {
        const incorrectas = res.value;
        const correctas = m.total - incorrectas;
        const puntaje = consultarPuntaje(key, incorrectas);

        state[key].valid = true;
        state[key].incorrectas = incorrectas;
        state[key].score = puntaje;

        card.classList.remove('invalid');
        errorEl.textContent = '';
        correctEl.textContent = correctas;
        animarNumero(scoreEl, puntaje);
        barEl.style.width = puntaje + '%';

        const filledBubbles = Math.round((correctas / m.total) * 10);
        bubbles.forEach((b, i) => b.classList.toggle('filled', i < filledBubbles));

        // Log info del recálculo
        logConsole(`${m.nombre.toUpperCase()}: incorrectas=${incorrectas} | correctas=${correctas} → ${puntaje} pts`, 'INFO');
      }

      actualizarGlobal();
    }

    function actualizarGlobal() {
      const globalScoreEl = document.getElementById('global-score');
      const warningEl = document.getElementById('ticket-warning');
      const todasValidas = materias.every(m => state[m.key].valid);

      if (!todasValidas) {
        warningEl.hidden = false;
        globalScoreEl.textContent = '—';
        logConsole('Recálculo global abortado. Hay materias con errores.', 'WARN');
        return;
      }
      warningEl.hidden = true;

      /* Puntaje Global = (((MAT×3)+(LC×3)+(SC×3)+(CN×3)+(ING×1)) / 13) × 5 */
      const suma =
        (state.matematicas.score * 3) +
        (state.lectura.score * 3) +
        (state.sociales.score * 3) +
        (state.naturales.score * 3) +
        (state.ingles.score * 1);
      const total = Math.round((suma / 13) * 5);

      const prevGlobal = Number(globalScoreEl.textContent) || 0;
      if (total !== prevGlobal) {
        animarNumero(globalScoreEl, total);
        animarTicket();
        logConsole(`CÁLCULO COMPLETADO -> Puntaje Global: ${total}/500 pts`, 'SUCCESS');
      }
    }

    materias.forEach(m => {
      const input = document.getElementById(`input-${m.key}`);
      const card = input.closest('.card');

      input.addEventListener('input', () => actualizarMateria(m.key));

      card.querySelectorAll('.step-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const dir = btn.dataset.action === 'inc' ? 1 : -1;
          const actual = Number(input.value) || 0;
          const nuevo = Math.min(m.total, Math.max(0, actual + dir));
          input.value = nuevo;
          actualizarMateria(m.key);
        });
      });

      actualizarMateria(m.key);
    });

    /* Reiniciar */
    document.getElementById('btn-reset').addEventListener('click', () => {
      logConsole('Ejecutando reinicio completo de valores...', 'WARN');
      materias.forEach(m => {
        document.getElementById(`input-${m.key}`).value = 0;
        actualizarMateria(m.key);
      });
      logConsole('Reinicio completado. Todos los valores inicializados a 0 incorrectas.', 'SUCCESS');
    });

    /* Copiar resultado */
    document.getElementById('btn-copy').addEventListener('click', async () => {
      logConsole('Generando cadena de resultados para portapapeles...', 'INFO');
      const todasValidas = materias.every(m => state[m.key].valid);
      let texto = 'Resultado ICFES\n----------------\n';
      materias.forEach(m => {
        const s = state[m.key];
        if (s.valid) {
          texto += `${m.nombre}: ${s.incorrectas} incorrectas, ${m.total - s.incorrectas} correctas → ${s.score} pts\n`;
        } else {
          texto += `${m.nombre}: valor inválido\n`;
        }
      });
      texto += '----------------\n';
      texto += todasValidas
        ? `Puntaje global: ${document.getElementById('global-score').textContent}/500`
        : 'Puntaje global: pendiente (corrige los campos marcados en rojo)';

      try {
        await navigator.clipboard.writeText(texto);
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 1800);
        logConsole('Cadena de resultados copiada al portapapeles con éxito.', 'SUCCESS');
      } catch (e) {
        alert(texto);
        logConsole('Error al escribir en portapapeles. Mostrando fallback alerta.', 'WARN');
      }
    });

    /* Tema claro/oscuro */
    const root = document.documentElement;
    const themeBtn = document.getElementById('theme-toggle');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    root.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
    logConsole(`Inicializado en modo: ${prefersDark ? 'DARK' : 'LIGHT'}`, 'INFO');

    themeBtn.addEventListener('click', () => {
      const actual = root.getAttribute('data-theme');
      const nuevo = actual === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', nuevo);
      logConsole(`Cambio de interfaz -> Modo ${nuevo.toUpperCase()}`, 'INFO');
    });
  </script>
</body>

</html>
